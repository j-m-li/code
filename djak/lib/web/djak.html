console.log_str = function (s) {

function array(size) {
	return new Array(size);
}

function std()
{
	return this;
}

std.get_args = function()
{
	return std.args;
}

std.get_argc = function()
{
	return std.argc;
}

std.exit = function()
{
	return 0;
}

std.stralloc = function(obj, len)
{
	obj._str = new String(len);
	return obj._str;
}

std.strrelease = function(obj)
{
	obj._str = undefined;
	return 0;
}

std.strlen = function(str)
{
	if (str === undefined) {
		return 0;
	}
	return str.length;
}

std.strindex = function(hayst, offset, needle)
{
	return hayst._str.indexOf(needle._str, offset);
}

std.strappend = function(dest, dpos, src, start, maxlen)
{
	if (src == undefined || src._str === undefined) {
		return dest;
	}
	dest._str = dest._str.substr(dpos) + src._str.substr(start);
	return dest;
}

std.str_set_at = function(dest, pos, va)
{
	dest._str = dest._str.substr(pos) + String.fromCodePoint(va) 
		+ dest._str.substr(pos+1);
	return dest;
}

std.native2string = function (buf) {
	var data;
	data = new string(1);
	data._str = buf;
	return data;

}

std.hex_val = function(c)
{
	if (c >= 48 && c <= 57) {
		return c - '0';
	} else  if (c >= 97 && c <= 102) {
		return c - 97 + 10;
	} else  if (c >= 65 && c <= 70) {
		return c - 65 + 10;
	}
	return 0;
}

std.is_octal = function(c)
{
	if (c >= 48 && c <= 55) {
		return 1;
	}
	return 0;
}

std.cp = function(b, i, o) {
	return b.codePointAt(i+o);
}

std.unescape_to_int = function(src)
{
	var b;
	var n = 0;
	var v;
	var l;
	var i;
	b = src._str;
	l = b.length;
	i = 0;
	while (i < l) {
		n = n * 255;
		if (std.cp(b,i,0) == 92) {
			i++;	
			switch (std.cp(b,i,0)) {
			case 97: n += 7; break;
			case 98: n += 8; break;
			case 102: n += 12; break;
			case 110: n += 10; break;
			case 114: n += 13; break;
			case 116: n += 9; break;
			case 118: n += 11; break;
			case 78:
				if (!is_hex(std.cp(b,i, 1))) {
					n += std.cp(b,i, 0);
				} else {
					v = 0;
					while (is_hex(std.cp(b,i,1))) {
						v *= 16;
						i++;
						v += hex_val(std.cp(b,i,0));
					}
					n += v;
				}
				break;
			case 48:
				if (!is_octal(std.cp(b,i,1))) {
					n += 0;
				} else {
					v = 0;
					while (is_octal(std.cp(b,i,1))) {
						v *= 8;
						i++;
						v += hex_val(std.cp(b,i,0));
					}
					n += v;
				}
				break;
			default:
				n += 92;
				n = n * 255;
				n += std.cp(b,i,0);
			}
		} else {
			n += std.cp(b,i,0);
		}
		i++;
        }
	return n;
}

std.move = function (obj, parent)

	return obj;
}

std.char_to_int = function(v)

}
